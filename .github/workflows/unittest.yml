name: ROS2 Messages Unit Test
on:
  pull_request:
  workflow_dispatch:

jobs:
  ros2_msgs_unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Cache CMake FetchContent deps
        uses: actions/cache@v4
        with:
          path: tests/gtest/build/_deps
          key: ${{ runner.os }}-ros2-msgs-gtest-${{ hashFiles('tests/gtest/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ros2-msgs-gtest-

      - name: Configure CMake
        run: cmake -S tests/gtest -B tests/gtest/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build tests/gtest/build --parallel

      - name: Run tests
        run: ctest --test-dir tests/gtest/build --output-on-failure
